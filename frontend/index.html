<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Referral share link: getofferly.in/invite/CODE. Android goes to the Play
         Store (code passed as the install referrer); iPhone and desktop stay on
         the website with the code pre-filled at signup. Runs before the app
         bundle loads so the redirect is instant. -->
    <script>
      (function () {
        var m = location.pathname.match(/^\/invite\/([A-Za-z0-9]{1,20})\/?$/);
        if (!m) return;
        var code = m[1].toUpperCase();
        var inApp = window.Capacitor || window.ReactNativeWebView || window.flutter_inappwebview;
        if (/android/i.test(navigator.userAgent) && !inApp) {
          location.replace('https://play.google.com/store/apps/details?id=com.offerly.user&referrer=' +
            encodeURIComponent('utm_source=referral&utm_medium=invite&utm_content=' + code));
          return;
        }
        try { localStorage.setItem('offerly_signup_referral', code); } catch (e) {}
        location.replace('/login?ref=' + code);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a plain stylesheet link stops first paint until Google answers.
         display=swap already shows text in the fallback font until Poppins arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" /></noscript>
    <link rel="icon" type="image/png" href="/offerly-logo-ring.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/splash-screen-clean@3x.webp?v=6" type="image/webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#5EB929" id="theme-color-meta" />
    <meta name="description" content="Offerly — Discover and redeem exclusive local offers near you" />
    <title>Offerly — Local Deals & Offers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Short links that send Android phones to the Play Store and everyone
         else to the website. Run before the app bundle loads, so they're instant.
           getofferly.in/invite/CODE - referral share link; the code goes to the
             Play Store as the install referrer, or is pre-filled at signup.
           getofferly.in/app - promotion link (printed QR codes), no code.
         Targets can be changed here at any time without reprinting the QR. -->
    <script>
      (function () {
        var path = location.pathname;
        var invite = path.match(/^\/invite\/([A-Za-z0-9]{1,20})\/?$/);
        var promo = /^\/app\/?$/i.test(path);
        if (!invite && !promo) return;
        var code = invite ? invite[1].toUpperCase() : '';
        var inApp = window.Capacitor || window.ReactNativeWebView || window.flutter_inappwebview;
        if (/android/i.test(navigator.userAgent) && !inApp) {
          var referrer = code
            ? 'utm_source=referral&utm_medium=invite&utm_content=' + code
            : 'utm_source=qr&utm_medium=print&utm_campaign=promo';
          location.replace('https://play.google.com/store/apps/details?id=com.offerly.user&referrer=' +
            encodeURIComponent(referrer));
          return;
        }
        if (!code) {
          location.replace('/');
          return;
        }
        try { localStorage.setItem('offerly_signup_referral', code); } catch (e) {}
        location.replace('/login?ref=' + code);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a plain stylesheet link stops first paint until Google answers.
         display=swap already shows text in the fallback font until Poppins arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" /></noscript>
    <link rel="icon" type="image/png" href="/offerly-icon-64.png" />
    <link rel="apple-touch-icon" href="/offerly-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#5EB929" id="theme-color-meta" />
    <meta name="description" content="Offerly — Discover and redeem exclusive local offers near you" />
    <title>Offerly — Local Deals & Offers</title>
  </head>
  <body>
    <!-- Splash picture shown from the first paint while the app's JS downloads,
         so the phone isn't stuck on a blank screen. Same rule as App.jsx: once per
         session, forced by ?splash=1, never on business routes. main.jsx removes it. -->
    <div id="boot-splash" style="display:none;position:fixed;inset:0;z-index:99998;background:linear-gradient(to bottom,#FAFEF7,#F4FBF1,#E2F5DC)">
      <img id="boot-splash-img" alt="" fetchpriority="high" style="width:100%;height:100%;object-fit:cover" />
    </div>
    <script>
      (function () {
        var p = location.pathname, seen = false;
        if (/^\/(merchant|admin|delivery)/.test(p)) return;
        try { seen = sessionStorage.getItem('offerly_splash_seen') === '1'; } catch (e) {}
        if (/[?&]splash=(1|true)\b/.test(location.search) || !seen) {
          // Only fetched when shown: the merchant, admin and delivery apps never
          // download this 76 KB picture.
          document.getElementById('boot-splash-img').src = '/splash-screen-clean@2x.webp?v=7';
          document.getElementById('boot-splash').style.display = 'block';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
